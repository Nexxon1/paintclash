name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # husky is a local convenience only; CI runs the same gates explicitly.
  HUSKY: 0

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage gates (per package, spec §9.3) fail the job below their floor.
      - run: pnpm test:coverage
      # Stack-crossing scenario tests: real server + sim-clients in workerd (§9.1).
      - run: pnpm test:scenario
      # Bench smoke/unit tests (fast; the slow sweep stays manual via `pnpm bench`).
      # fill-budget's smoke test guards the budget run's PREMISE — that the bots
      # actually paint. Without it a broken harness would pass by measuring an
      # empty arena, and nobody would find out until the manual run.
      - run: pnpm --filter @paintclash/bench-do-cpu test
      - run: pnpm --filter @paintclash/bench-fill-budget test
      - run: pnpm --filter @paintclash/bench-carve-budget test
      # territory-bandwidth's smoke test guards the same premise plus one more:
      # that the tolerance sweep actually decimates. A sweep whose "after"
      # column silently equals its "before" column is the one failure its own
      # table could not reveal, because both numbers look plausible.
      - run: pnpm --filter @paintclash/bench-territory-bandwidth test
      # prod-arena's smoke test is its autopilot flown offline: it opens no
      # socket and needs no deployment, and it is what keeps the manual
      # production run from measuring an arena where nothing ever fills.
      - run: pnpm --filter @paintclash/bench-prod-arena test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # CD gate (spec §9.5): deploys only when every gate above is green AND this is
  # a push to main. A red main push rolls out nothing.
  deploy:
    needs: [typecheck, lint, test, build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the client into packages/client/dist, which is the directory
      # `packages/server/wrangler.jsonc` serves as Static Assets — the deploy
      # step below ships whatever this produced.
      - run: pnpm build
      - name: Deploy the game to Cloudflare (Free plan, no card — spec §7.3)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/server
          # Stamp the deployed commit SHA into the Worker (surfaced at /api/health).
          command: deploy --var COMMIT_SHA:${{ github.sha }}
      # A deploy that reported success but is not serving THIS commit is the one
      # failure mode a green CD gate would otherwise hide (a rollout that landed
      # on a stale version, an assets upload that did not). The health probe
      # carries the SHA precisely so this check can exist; it is the last word on
      # whether main is live, and it retries because propagation is not instant.
      - name: Verify the deployment serves this commit
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://paintclash.secure-data.workers.dev' }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsS "$DEPLOY_URL/api/health" | jq -r .commit || true)
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "live on $DEPLOY_URL @ $live"
              exit 0
            fi
            echo "attempt $attempt: serving '$live', want '${{ github.sha }}'"
            sleep 10
          done
          echo "::error::$DEPLOY_URL is not serving ${{ github.sha }}"
          exit 1
