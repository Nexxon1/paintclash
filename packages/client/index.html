<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paintclash</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        /* Touch steering (spec §3) owns every gesture on the arena: without
           this, a drag would scroll or pinch-zoom the page instead. */
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 28, 38, 0.55);
      }
      #overlay .card {
        background: #fff;
        border-radius: 12px;
        padding: 2rem 2.5rem;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      #overlay h1 {
        margin: 0 0 1rem;
        font-size: 1.6rem;
      }
      #overlay input {
        font-size: 1rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #c6ced8;
        border-radius: 8px;
        margin-right: 0.5rem;
      }
      #overlay button {
        font-size: 1rem;
        padding: 0.5rem 1.25rem;
        border: 0;
        border-radius: 8px;
        background: #2f7fe8;
        color: #fff;
        cursor: pointer;
      }
      #status {
        min-height: 1.2em;
        color: #5b6672;
        margin: 0.75rem 0 0;
      }
      /* Live leaderboard (spec §2.5): top 5 + the own, highlighted row. */
      #leaderboard {
        position: fixed;
        top: 1rem;
        right: 1rem;
        min-width: 13rem;
        padding: 0.5rem 0.6rem;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 4px 16px rgba(20, 28, 38, 0.18);
        font-size: 0.85rem;
        color: #2b3540;
        user-select: none;
      }
      #leaderboard h2,
      #score h2 {
        margin: 0 0 0.35rem;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7684;
      }
      .leaderboard-rows {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.15rem;
      }
      .leaderboard-rows .row {
        display: grid;
        grid-template-columns: 1.3rem 0.7rem 1fr auto;
        align-items: center;
        gap: 0.4rem;
        padding: 0.15rem 0.3rem;
        border-radius: 6px;
      }
      .leaderboard-rows .row.self {
        background: rgba(47, 127, 232, 0.16);
        font-weight: 600;
      }
      .leaderboard-rows .rank {
        color: #6b7684;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .leaderboard-rows .swatch {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 3px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      }
      .leaderboard-rows .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .leaderboard-rows .percent {
        font-variant-numeric: tabular-nums;
      }
      /* Own score (spec §2.5): live estimate above the personal record. */
      #score {
        position: fixed;
        top: 1rem;
        left: 1rem;
        padding: 0.4rem 0.75rem;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 4px 16px rgba(20, 28, 38, 0.18);
        color: #2b3540;
        display: grid;
        justify-items: start;
        user-select: none;
      }
      #score .score-value {
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      #score .score-record {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6b7684;
        font-variant-numeric: tabular-nums;
      }
      /* `display` beats the UA stylesheet's `[hidden] { display: none }`, so
         every panel that hides itself has to say so again (the score panel
         before the first score frame, the joystick with no finger on it). */
      #score[hidden],
      #joystick[hidden] {
        display: none;
      }
      /* Beating the highscore is the whole point of showing both numbers. */
      #score.record {
        background: rgba(47, 127, 232, 0.9);
        color: #fff;
      }
      #score.record h2,
      #score.record .score-record {
        color: rgba(255, 255, 255, 0.85);
      }
      #records {
        margin: 0.75rem 0 0;
        font-size: 0.8rem;
        color: #5b6672;
      }
      /* Control modes (spec §3) — switchable at runtime, so the picker stays
         reachable during the game AND on top of the join card (hence the
         z-index: the overlay would otherwise swallow every click). It sits at
         the top edge and collapses: the bottom corners belong to the steering
         thumb (Lenken L/R rests there, the joystick is planted there). */
      #controls {
        position: fixed;
        top: 0.75rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: grid;
        justify-items: center;
        gap: 0.35rem;
        user-select: none;
      }
      #controls button {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.35rem 0.75rem;
        border: 1px solid #c6ced8;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 4px 16px rgba(20, 28, 38, 0.18);
        color: #2b3540;
        cursor: pointer;
      }
      /* One chip per row inside a panel of its own: a horizontal row of pills
         wraps badly on a phone and shows the leaderboard through the gaps —
         an open menu should read as one opaque block over the HUD. */
      .control-modes {
        display: grid;
        gap: 0.3rem;
        padding: 0.4rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 8px 24px rgba(20, 28, 38, 0.25);
      }
      .control-modes[hidden] {
        display: none;
      }
      .control-modes .mode {
        box-shadow: none;
        text-align: center;
      }
      .control-modes .mode.active {
        background: #2f7fe8;
        border-color: #2f7fe8;
        color: #fff;
      }
      /* Virtual joystick: drawn where the finger holds it, never in the way
         of the gesture itself (the canvas keeps the pointer capture). */
      #joystick {
        position: fixed;
        top: 0;
        left: 0;
        /* Pixels, not rem: the ring IS the full deflection the input layer
           clamps the knob to (JOYSTICK_RADIUS_PX = 60 in game/input.ts). */
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.75);
        background: rgba(20, 28, 38, 0.18);
        pointer-events: none;
        display: grid;
        place-items: center;
      }
      #joystick .knob {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 2px 10px rgba(20, 28, 38, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <!-- The heading labels the big number, so the record line below it needs
         no unit of its own (same treatment as the leaderboard panel). -->
    <div id="score" hidden><h2>Score</h2></div>
    <div id="leaderboard" hidden>
      <h2>Leaderboard</h2>
    </div>
    <!-- Control modes (spec §3) — filled by main.ts, which knows the device:
         it decides both which modes are offered and what they are called. -->
    <div id="controls"></div>
    <div id="joystick" hidden></div>
    <div id="overlay">
      <div class="card">
        <h1>paintclash</h1>
        <form id="join-form">
          <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="off" />
          <!-- Enabled by main.ts once the module is wired — a click before
               that would fire a native submit and reload the page. -->
          <button type="submit" disabled>Spielen</button>
        </form>
        <p id="status"></p>
        <!-- Local records (spec §2.5) — filled by main.ts from localStorage. -->
        <p id="records"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
