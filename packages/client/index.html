<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paintclash</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 28, 38, 0.55);
      }
      #overlay .card {
        background: #fff;
        border-radius: 12px;
        padding: 2rem 2.5rem;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      #overlay h1 {
        margin: 0 0 1rem;
        font-size: 1.6rem;
      }
      #overlay input {
        font-size: 1rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #c6ced8;
        border-radius: 8px;
        margin-right: 0.5rem;
      }
      #overlay button {
        font-size: 1rem;
        padding: 0.5rem 1.25rem;
        border: 0;
        border-radius: 8px;
        background: #2f7fe8;
        color: #fff;
        cursor: pointer;
      }
      #status {
        min-height: 1.2em;
        color: #5b6672;
        margin: 0.75rem 0 0;
      }
      /* Live leaderboard (spec §2.5): top 5 + the own, highlighted row. */
      #leaderboard {
        position: fixed;
        top: 1rem;
        right: 1rem;
        min-width: 13rem;
        padding: 0.5rem 0.6rem;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 4px 16px rgba(20, 28, 38, 0.18);
        font-size: 0.85rem;
        color: #2b3540;
        user-select: none;
      }
      #leaderboard h2 {
        margin: 0 0 0.35rem;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7684;
      }
      .leaderboard-rows {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.15rem;
      }
      .leaderboard-rows .row {
        display: grid;
        grid-template-columns: 1.3rem 0.7rem 1fr auto;
        align-items: center;
        gap: 0.4rem;
        padding: 0.15rem 0.3rem;
        border-radius: 6px;
      }
      .leaderboard-rows .row.self {
        background: rgba(47, 127, 232, 0.16);
        font-weight: 600;
      }
      .leaderboard-rows .rank {
        color: #6b7684;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .leaderboard-rows .swatch {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 3px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      }
      .leaderboard-rows .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .leaderboard-rows .percent {
        font-variant-numeric: tabular-nums;
      }
      /* Own score (spec §2.5): live estimate above the personal record. */
      #score {
        position: fixed;
        top: 1rem;
        left: 1rem;
        padding: 0.4rem 0.75rem;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 4px 16px rgba(20, 28, 38, 0.18);
        color: #2b3540;
        display: grid;
        justify-items: start;
        user-select: none;
      }
      #score .score-value {
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      #score .score-record {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6b7684;
        font-variant-numeric: tabular-nums;
      }
      /* Beating the highscore is the whole point of showing both numbers. */
      #score.record {
        background: rgba(47, 127, 232, 0.9);
        color: #fff;
      }
      #score.record .score-record {
        color: rgba(255, 255, 255, 0.85);
      }
      #records {
        margin: 0.75rem 0 0;
        font-size: 0.8rem;
        color: #5b6672;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="score" hidden></div>
    <div id="leaderboard" hidden>
      <h2>Leaderboard</h2>
    </div>
    <div id="overlay">
      <div class="card">
        <h1>paintclash</h1>
        <form id="join-form">
          <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="off" />
          <!-- Enabled by main.ts once the module is wired — a click before
               that would fire a native submit and reload the page. -->
          <button type="submit" disabled>Spielen</button>
        </form>
        <p id="status"></p>
        <!-- Local records (spec §2.5) — filled by main.ts from localStorage. -->
        <p id="records"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
