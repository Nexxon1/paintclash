<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paintclash</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        /* Touch steering (spec §3) owns every gesture on the arena: without
           this, a drag would scroll or pinch-zoom the page instead. */
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 28, 38, 0.55);
      }
      #overlay .card {
        background: #fff;
        border-radius: 12px;
        padding: 2rem 2.5rem;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      #overlay h1 {
        margin: 0 0 1rem;
        font-size: 1.6rem;
      }
      #overlay input {
        font-size: 1rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #c6ced8;
        border-radius: 8px;
        margin-right: 0.5rem;
      }
      #overlay button {
        font-size: 1rem;
        padding: 0.5rem 1.25rem;
        border: 0;
        border-radius: 8px;
        background: #2f7fe8;
        color: #fff;
        cursor: pointer;
      }
      #status {
        min-height: 1.2em;
        color: #5b6672;
        margin: 0.75rem 0 0;
      }
      /* Nickname pre-check line. Reserves its height so the card does not jump
         while typing; emphasised only when the name is going to be replaced.
         It never gates the button — the server enforces (ticket 13). */
      #name-hint {
        min-height: 1.2em;
        font-size: 0.9rem;
        color: #5b6672;
        margin: 0.5rem 0 0;
      }
      #name-hint.blocked {
        color: #c62828;
      }
      /* Live leaderboard (spec §2.5): top 5 + the own, highlighted row. */
      #leaderboard {
        position: fixed;
        top: 1rem;
        right: 1rem;
        min-width: 13rem;
        padding: 0.5rem 0.6rem;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 4px 16px rgba(20, 28, 38, 0.18);
        font-size: 0.85rem;
        color: #2b3540;
        user-select: none;
      }
      #leaderboard h2,
      #score h2 {
        margin: 0 0 0.35rem;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7684;
      }
      .leaderboard-rows {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.15rem;
      }
      .leaderboard-rows .row {
        display: grid;
        grid-template-columns: 1.3rem 0.7rem 1fr auto;
        align-items: center;
        gap: 0.4rem;
        padding: 0.15rem 0.3rem;
        border-radius: 6px;
      }
      .leaderboard-rows .row.self {
        background: rgba(47, 127, 232, 0.16);
        font-weight: 600;
      }
      .leaderboard-rows .rank {
        color: #6b7684;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .leaderboard-rows .swatch {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 3px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      }
      .leaderboard-rows .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .leaderboard-rows .percent {
        font-variant-numeric: tabular-nums;
      }
      /* Own score (spec §2.5): live estimate above the personal record. */
      #score {
        position: fixed;
        top: 1rem;
        left: 1rem;
        padding: 0.4rem 0.75rem;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 4px 16px rgba(20, 28, 38, 0.18);
        color: #2b3540;
        display: grid;
        justify-items: start;
        user-select: none;
      }
      #score .score-value {
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      #score .score-record {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6b7684;
        font-variant-numeric: tabular-nums;
      }
      /* `display` beats the UA stylesheet's `[hidden] { display: none }`, so
         every panel that hides itself has to say so again (the score panel
         before the first score frame, the joystick with no finger on it). */
      #score[hidden],
      #joystick[hidden] {
        display: none;
      }
      /* Beating the highscore is the whole point of showing both numbers. */
      #score.record {
        background: rgba(47, 127, 232, 0.9);
        color: #fff;
      }
      #score.record h2,
      #score.record .score-record {
        color: rgba(255, 255, 255, 0.85);
      }
      #records {
        margin: 0.75rem 0 0;
        font-size: 0.8rem;
        color: #5b6672;
      }
      /* Private rooms (spec §2.6). Below the public join, separated by a rule:
         the public arena is the default way in, a room is the deliberate one. */
      #rooms {
        margin-top: 1.1rem;
        padding-top: 0.9rem;
        border-top: 1px solid #e3e8ee;
        display: grid;
        gap: 0.5rem;
        justify-items: center;
      }
      #rooms button {
        font-size: 0.9rem;
        padding: 0.45rem 1rem;
        /* Slate rather than the primary blue: the public "Spielen" above stays
           the one obvious action on the card. */
        background: #56626f;
      }
      #rooms .room-join {
        display: flex;
        gap: 0.4rem;
      }
      #rooms input {
        margin: 0;
        width: 8.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.95rem;
      }
      /* Arrived through a shared link: the room row is what the player came for,
         so it leads instead of trailing the public button. */
      #join-card.linked #rooms {
        order: -1;
      }
      #join-card.linked #rooms .room-join input {
        border-color: #2f7fe8;
      }
      /* The lobby card (spec §2.6) — the join card's other face. */
      #lobby[hidden] {
        display: none;
      }
      #lobby {
        display: grid;
        gap: 0.6rem;
        justify-items: center;
        min-width: 19rem;
      }
      #lobby h2 {
        margin: 0;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #6b7684;
      }
      #lobby .room-code {
        margin: 0;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        font-variant-numeric: tabular-nums;
        color: #2b3540;
      }
      #lobby .room-share {
        display: flex;
        gap: 0.4rem;
        width: 100%;
      }
      #lobby .room-link {
        flex: 1;
        margin: 0;
        font-size: 0.8rem;
        color: #5b6672;
      }
      #lobby .room-copy {
        font-size: 0.8rem;
        padding: 0.4rem 0.7rem;
        background: #6b7684;
      }
      #lobby .room-count {
        margin: 0;
        font-size: 0.8rem;
        color: #6b7684;
      }
      #lobby .room-members {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.2rem;
        width: 100%;
      }
      #lobby .member {
        display: grid;
        grid-template-columns: 0.75rem 1fr auto;
        align-items: center;
        gap: 0.45rem;
        padding: 0.2rem 0.35rem;
        border-radius: 6px;
        font-size: 0.9rem;
        text-align: left;
      }
      #lobby .member.self {
        background: rgba(47, 127, 232, 0.16);
        font-weight: 600;
      }
      #lobby .member .swatch {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 3px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      }
      #lobby .member .host {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6b7684;
      }
      #lobby .room-settings {
        display: grid;
        gap: 0.35rem;
        width: 100%;
        padding-top: 0.5rem;
        border-top: 1px solid #e3e8ee;
      }
      #lobby .room-field {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: #2b3540;
        text-align: left;
      }
      #lobby .room-field input[type='number'] {
        margin: 0;
        width: 5rem;
        font-size: 0.9rem;
        padding: 0.3rem 0.4rem;
      }
      #lobby .room-field input:disabled {
        background: #f3f5f8;
        color: #6b7684;
      }
      #lobby .room-actions {
        display: flex;
        gap: 0.5rem;
        padding-top: 0.3rem;
      }
      #lobby .room-leave {
        background: #6b7684;
      }
      #lobby .room-start[hidden] {
        display: none;
      }
      #lobby .room-hint {
        margin: 0;
        font-size: 0.8rem;
        color: #6b7684;
      }
      /* Control modes (spec §3) — switchable at runtime, so the picker stays
         reachable during the game AND on top of the join card (hence the
         z-index: the overlay would otherwise swallow every click). It sits at
         the top edge and collapses: the bottom corners belong to the steering
         thumb (Lenken L/R rests there, the joystick is planted there). */
      /* Two cells wide: the "Steuerung" pill and the mute toggle (spec §4.4)
         share the bar, the mode menu spans both underneath. The cells are
         assigned explicitly, so neither panel depends on the other's DOM
         order — main.ts builds them independently. */
      #controls {
        position: fixed;
        top: 0.75rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: grid;
        grid-template-columns: auto auto;
        justify-content: center;
        justify-items: center;
        gap: 0.35rem;
        user-select: none;
      }
      #controls .control-toggle {
        grid-area: 1 / 1;
      }
      #controls .sound-toggle {
        grid-area: 1 / 2;
        /* Square-ish: the glyph is one character, and a pill as wide as
           "Steuerung" would read as the more important of the two. */
        padding: 0.35rem 0.55rem;
        line-height: 1;
      }
      #controls .control-modes {
        grid-area: 2 / 1 / 3 / 3;
      }
      #controls button {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.35rem 0.75rem;
        border: 1px solid #c6ced8;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 4px 16px rgba(20, 28, 38, 0.18);
        color: #2b3540;
        cursor: pointer;
      }
      /* One chip per row inside a panel of its own: a horizontal row of pills
         wraps badly on a phone and shows the leaderboard through the gaps —
         an open menu should read as one opaque block over the HUD. */
      .control-modes {
        display: grid;
        gap: 0.3rem;
        padding: 0.4rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 8px 24px rgba(20, 28, 38, 0.25);
      }
      .control-modes[hidden] {
        display: none;
      }
      .control-modes .mode {
        box-shadow: none;
        text-align: center;
      }
      .control-modes .mode.active {
        background: #2f7fe8;
        border-color: #2f7fe8;
        color: #fff;
      }
      /* Virtual joystick: drawn where the finger holds it, never in the way
         of the gesture itself (the canvas keeps the pointer capture). */
      #joystick {
        position: fixed;
        top: 0;
        left: 0;
        /* Pixels, not rem: the ring IS the full deflection the input layer
           clamps the knob to (JOYSTICK_RADIUS_PX = 60 in game/input.ts). */
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.75);
        background: rgba(20, 28, 38, 0.18);
        pointer-events: none;
        display: grid;
        place-items: center;
      }
      #joystick .knob {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 2px 10px rgba(20, 28, 38, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <!-- The heading labels the big number, so the record line below it needs
         no unit of its own (same treatment as the leaderboard panel). -->
    <div id="score" hidden><h2>Score</h2></div>
    <div id="leaderboard" hidden>
      <h2>Leaderboard</h2>
    </div>
    <!-- Top bar: control modes (spec §3) — filled by main.ts, which knows the
         device: it decides both which modes are offered and what they are
         called — plus the mute toggle (spec §4.4). -->
    <div id="controls"></div>
    <div id="joystick" hidden></div>
    <div id="overlay">
      <div class="card">
        <h1>paintclash</h1>
        <!-- The join form and the lobby are the two faces of the same card: a
             client in a private room's lobby is waiting, not playing (spec
             §2.6), so main.ts swaps one for the other. -->
        <div id="join-card">
          <form id="join-form">
            <!-- `maxlength` counts UTF-16 units, not the code points the policy
               caps at, so it is a coarse guard: exact for the ASCII names
               nearly everyone types, conservative for emoji (an astral
               character costs two). It can only ever stop a name SHORT, never
               let an illegal one through, and the hint below previews whatever
               the policy does change. -->
            <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="off" />
            <!-- Enabled by main.ts once the module is wired — a click before
               that would fire a native submit and reload the page. -->
            <button type="submit" disabled>Spielen</button>
          </form>
          <!-- Nickname pre-check (spec §2.8, ticket 13). UX only: the server
             runs the same rule and enforces it whatever this says. -->
          <p id="name-hint"></p>
          <p id="status"></p>
          <!-- Local records (spec §2.5) — filled by main.ts from localStorage. -->
          <p id="records"></p>
          <!-- Private rooms (spec §2.6): create one and share the link, or enter a
             code someone shared. Never a public list — the code IS the access. -->
          <div id="rooms">
            <button id="create-room" type="button">Privaten Raum erstellen</button>
            <div class="room-join">
              <input
                id="room-code"
                maxlength="8"
                placeholder="Raum-Code"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="join-room" type="button">Beitreten</button>
            </div>
          </div>
        </div>
        <!-- The lobby (spec §2.6) — built by render/room-hud.ts. -->
        <div id="lobby" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
